name: POCApp

options:
  bundleIdPrefix: com.offsite.poc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AppContracts:
    path: Packages/AppContracts
  ContactsPackage:
    path: Packages/ContactsPackage
  NotesPackage:
    path: Packages/NotesPackage

targets:
  POCApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - POCApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offsite.poc.POCApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: AppContracts
        product: AppContracts
      - package: ContactsPackage
        product: Contacts
      - package: ContactsPackage
        product: ContactsContracts
      - package: NotesPackage
        product: NotesListFeature
      - package: NotesPackage
        product: NoteDetailsFeature
